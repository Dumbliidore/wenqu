[project]
name = "wenqu"
version = "1.0.0"
description = "问渠在线（Wenqu）—— 基于 Django 6 + django-unfold 的在线教育平台"
requires-python = ">=3.12"
dependencies = [
    "django>=6.1.2,<6.2",
    "django-unfold>=0.109.0,<0.110",
    "django-simple-captcha>=0.7.0,<0.8",
    "django-ckeditor-5>=0.2.20,<0.3",
    "pillow>=12.0.0",
    "dj-database-url>=3.0.1",
    "python-dotenv>=1.1.0",
    "whitenoise>=6.12.0",
    "psycopg[binary]>=3.3.6",
]

[dependency-groups]
dev = []
deploy = [
    "gunicorn>=23.0.0",
]

[tool.uv]
package = false
