{% extends "base.html" %}

{% block custom_bread %}
    <section>
        <div class="wp">
            <ul  class="crumbs">
                <li><a href="{% url 'index' %}">首页</a>></li>
                <li><a href="{% url 'org:org_list' %}">课程机构</a>></li>
                <li>{% block page_path %}机构首页{% endblock %}</li>
            </ul>
        </div>
    </section>
{% endblock %}

{% block content %}
    <section>
        <div class="wp list personal_list comp">
            <div class="left">
                <ul>
                    <li class="{% if current_page == 'home' %}active2{% endif %}"><a href="{% url 'org:org_home' course_org.id %}">机构首页</a></li>
                    <li class="{% if current_page == 'course' %}active2{% endif %}"><a href="{% url 'org:org_course' course_org.id %}">机构课程</a></li>
                    <li class="{% if current_page == 'desc' %}active2{% endif %}"><a href="{% url 'org:org_desc' course_org.id %}">机构介绍</a></li>
                    <li class="{% if current_page == 'teacher' %}active2{% endif %}"><a href="{% url 'org:org_teacher' course_org.id %}">机构讲师</a></li>
                </ul>
            </div>
            {% block right_form %}
            {% endblock %}
        </div>
    </section>
{% endblock %}
