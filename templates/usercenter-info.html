{% extends 'usercenter-base.html' %}
{% load static %}
{% block title %}个人信息- 问渠在线{% endblock %}

{% block custom_bread %}
 <section>
        <div class="wp">
            <ul  class="crumbs">
                <li><a href="{% url 'index' %}">首页</a>></li>
                <li><a href="{% url 'users:user_info' %}">个人中心</a>></li>
                <li>个人信息</li>
            </ul>
        </div>
    </section>
{% endblock %}


{% block right_content %}
<div class="right">
		<div class="personal_des">
			<div class="head">
				<h1>个人信息</h1>
			</div>
			<div class="inforcon">
				<div class="left">
					<form class="clearfix" id="jsAvatarForm" enctype="multipart/form-data" autocomplete="off" method="post" action="{% url 'users:image_upload' %}">
						<label class="changearea" for="avatarUp">
							<span id="avatardiv" class="pic">
								<img class="js-img-show" id="avatarShow" src="{{ MEDIA_URL }}{{ request.user.image }}" alt="{{ user.username }}"/>
							</span>
							<span class="upload-inp-box">
								<span class="button btn-green btn-w100" id="jsAvatarBtn">修改头像</span>
								<input type="file" name="image" id="avatarUp" class="js-img-up"/>
							</span>
						</label>
						{% csrf_token %}
					</form>
					<div class="avatar-actions">
						<a class="button btn-green btn-w100" id="jsUserResetPwd">修改密码</a>
					</div>
				</div>
				<form class="perinform" id="jsEditUserForm" autocomplete="off">
					<ul class="right">
						<li><span class="lab">昵称</span>
                           <input type="text" name="nick_name" id="nick_name" value="{{ request.user.nick_name }}" maxlength="50">
                            <i class="error-tips"></i>
                        </li>
						<li><span class="lab">生日</span>
                           <input type="text" id="birth_day" name="birday" value="{{ request.user.birday|default_if_none:'' }}" readonly="readonly"/>
                            <i class="error-tips"></i>
						</li>
						<li><span class="lab">性别</span>
							<label><input type="radio" name="gender" value="male" {% if request.user.gender == 'male' %}checked="checked"{% endif %}>男</label>
							<label><input type="radio" name="gender" value="female" {% if request.user.gender == 'female' %}checked="checked"{% endif %}>女</label>
						</li>
						<li class="p_infor_city"><span class="lab">地址</span>
                            <input type="text" name="address" id="address" placeholder="请输入你的地址" value="{{ request.user.address }}" maxlength="100">
						    <i class="error-tips"></i>
                        </li>
						<li><span class="lab">手机号</span>
                            <input type="text" name="mobile" id="mobile" placeholder="请输入你的手机号码" value="{{ request.user.mobile|default_if_none:'' }}" maxlength="11">
                        </li>
                        <li><span class="lab">邮箱</span>
                        	<input class="borderno" type="text" name="email" readonly="readonly" value="{{ request.user.email }}"/>
                            <span class="green changeemai_btn">修改邮箱</span>
                    	</li>
						<li class="button heibtn">
							<input type="button" id="jsEditUserBtn" value="保存">
						</li>
					</ul>
                    {% csrf_token %}
				</form>
			</div>
		</div>
	</div>
{% endblock %}
