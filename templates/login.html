{% extends "auth-base.html" %}

{% block title %}问渠在线登录{% endblock %}

{% block heading %}帐号登录{% endblock %}

{% block card %}
<form class="auth-form" action="{% url 'login' %}" method="post" autocomplete="off">
	{% csrf_token %}
	<input type="hidden" name="next" value="{{ next }}" />
	<div class="form-group {% if login_form.errors.username %}errorput{% endif %}">
		<label for="account_l">用户名</label>
		<input name="username" id="account_l" type="text" value="{{ login_form.username.value|default_if_none:'' }}" placeholder="用户名 / 邮箱" />
	</div>
	<div class="form-group {% if login_form.errors.password %}errorput{% endif %}">
		<label for="password_l">密码</label>
		<input name="password" id="password_l" type="password" placeholder="请输入您的密码" />
	</div>
	{% include "includes/form_errors.html" with form=login_form %}
	{% if msg %}
		<p class="form-note ok">{{ msg }}</p>
	{% endif %}
	<p class="form-aux"><a href="{% url 'forget_pwd' %}">忘记密码？</a></p>
	<input class="auth-submit" type="submit" value="立即登录" />
</form>
<p class="auth-switch">没有问渠在线帐号？<a href="{% url 'register' %}">立即注册</a></p>
{% endblock %}
