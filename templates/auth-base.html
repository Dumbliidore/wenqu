<!DOCTYPE html>
{% load static %}
<html lang="zh-CN">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=1200">
	<meta name="renderer" content="webkit">
	<meta http-equiv="X-UA-Compatible" content="IE=Edge,chrome=1">
	<title>{% block title %}问渠在线{% endblock %}</title>
	<link rel="stylesheet" type="text/css" href="{% static 'css/tokens.css' %}">
	<link rel="stylesheet" type="text/css" href="{% static 'css/reset.css' %}">
	<link rel="stylesheet" type="text/css" href="{% static 'css/login.css' %}">
	{% block custom_css %}{% endblock %}
</head>
<body class="auth-body">
<div class="auth-band auth-top">
	<div class="auth-inner auth-head">
		<a class="auth-brand" href="{% url 'index' %}"><img src="{% static 'images/footlogo.png' %}" alt="问渠在线"/></a>
		<nav class="auth-tabs">
			<a class="auth-tab{% if request.resolver_match.url_name != 'register' %} active{% endif %}" href="{% url 'login' %}">登录</a>
			<a class="auth-tab{% if request.resolver_match.url_name == 'register' %} active{% endif %}" href="{% url 'register' %}">注册</a>
		</nav>
	</div>
</div>

<main class="auth-main">
	<section class="auth-card">
		<h1 class="auth-title">{% block heading %}{% endblock %}</h1>
		{% block card %}{% endblock %}
	</section>
</main>

<footer class="auth-band auth-bottom">
	<div class="auth-inner auth-foot">
		<nav class="auth-links">
			<a href="{% url 'index' %}">首页</a>
			<a href="{% url 'course:course_list' %}">公开课</a>
			<a href="{% url 'org:teacher_list' %}">授课教师</a>
			<a href="{% url 'org:org_list' %}">授课机构</a>
		</nav>
		<p class="auth-copy">© 2026 问渠在线（Wenqu）· 在线学习交流平台</p>
	</div>
</footer>

<script src="{% static 'js/jquery-3.7.1.min.js' %}" type="text/javascript"></script>
<script src="{% static 'js/login.js' %}" type="text/javascript"></script>
{% block custom_js %}{% endblock %}
</body>
</html>
