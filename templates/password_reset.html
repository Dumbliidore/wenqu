{% extends "auth-base.html" %}

{% block title %}密码修改{% endblock %}

{% block heading %}设置新密码{% endblock %}

{% block card %}
<form class="auth-form" method="post" action="{% url 'modify_pwd' %}" autocomplete="off">
	{% csrf_token %}
	<p class="form-desc">正在为 <span class="auth-email">{{ email }}</span> 设置新密码。</p>
	<div class="form-group {% if modify_form.errors.password1 %}errorput{% endif %}">
		<label for="pwd">新密码</label>
		<input type="password" id="pwd" name="password1" placeholder="8-20 位非中文字符" />
	</div>
	<div class="form-group {% if modify_form.errors.password2 %}errorput{% endif %}">
		<label for="repwd">确认密码</label>
		<input type="password" id="repwd" name="password2" placeholder="再输入一次" />
	</div>
	{% include "includes/form_errors.html" with form=modify_form %}
	{% if msg %}
		<p class="form-note bad">{{ msg }}</p>
	{% endif %}
	<input class="auth-submit" type="submit" value="提交" />
</form>
<p class="auth-switch">无需修改<a href="{% url 'login' %}">直接登录</a></p>
{% endblock %}
