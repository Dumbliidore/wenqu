<!DOCTYPE html>
{% load static %}
<html lang="zh-CN">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=1200">
    <meta name="renderer" content="webkit">
    <meta http-equiv="X-UA-Compatible" content="IE=Edge,chrome=1">
	<title>密码修改</title>
    <link rel="stylesheet" type="text/css" href="{% static 'css/reset.css' %}">
    <link rel="stylesheet" type="text/css" href="{% static 'css/login.css' %}">
</head>
<body>
<header>
    <div class="c-box fff-box">
        <div class="wp header-box">
            <p class="fl hd-tips">问渠在线 · 源头活水</p>
            <ul class="fr hd-bar">
                <li class="active"><a href="{% url 'login' %}">[登录]</a></li>
                <li><a href="{% url 'register' %}">[注册]</a></li>
            </ul>
        </div>
    </div>
</header>
<section>
    <div class="c-box bg-box">
        <div class="login-box clearfix">
            <div class="hd-login clearfix">
                <a class="index-logo" href="{% url 'index' %}"></a>
                <h1>修改密码</h1>
                <a class="index-font" href="{% url 'index' %}">回到首页</a>
            </div>
            <div class="fl slide">
                <div class="imgslide">
                    <ul class="imgs">
                        <li><a><img width="483" height="472" src="{% static 'images/57a801860001c34b12000460.jpg' %}" /></a></li>
                        <li><a><img width="483" height="472" src="{% static 'images/57a801860001c34b12000460.jpg' %}" /></a></li>
                        <li><a><img width="483" height="472" src="{% static 'images/57a801860001c34b12000460.jpg' %}" /></a></li>
                    </ul>
                </div>
                <div class="unslider-arrow prev"></div>
                <div class="unslider-arrow next"></div>
            </div>
            <div class="fl form-box">
                <h2>修改密码</h2>
                <form id="reset_password_form" method="post" action="{% url 'modify_pwd' %}" autocomplete="off">
                    {% csrf_token %}
                    <div class="form-group marb8 {% if modify_form.errors.password1 %}errorput{% endif %}">
                        <label>新 密 码</label>
                        <input type="password" id="pwd" name="password1" placeholder="8-20位非中文字符" />
                    </div>
                    <div class="form-group captcha1 marb8 {% if modify_form.errors.password2 %}errorput{% endif %}">
                        <label>确定密码</label>
                        <input type="password" id="repwd" name="password2" placeholder="8-20位非中文字符" />
                    </div>
                    <div class="error btns" id="jsForgetTips">{% for key, error in modify_form.errors.items %}{{ error }}{% endfor %}{{ msg }}</div>

                    <input type="hidden" name="sms_type" value="1">
                    <input class="btn btn-green" id="jsFindPwdBtn" type="submit" value="提交" />
                    <p class="form-p" style="bottom:40px;">无需修改<a href="{% url 'login' %}"> [直接登录]</a></p>
                </form>
            </div>
        </div>
    </div>
</section>

<script src="{% static 'js/jquery-3.7.1.min.js' %}" type="text/javascript"></script>
<script src="{% static 'js/unslider.js' %}" type="text/javascript"></script>
<script src="{% static 'js/login.js' %}"  type="text/javascript"></script>
</body>
</html>
