{% load static %}
{% if request.user.is_authenticated %}
    <div class="personal">
        <dl class="user fr">
            <dd>{{ user.username }}<img class="down fr" src="{% static 'images/top_down.png' %}"/></dd>
            <dt><img src="{{ MEDIA_URL }}{{ request.user.image }}" alt="{{ user.username }}"/></dt>
        </dl>
        <div class="userdetail">
            <dl>
                <dt><img src="{{ MEDIA_URL }}{{ request.user.image }}" alt="{{ user.username }}"/></dt>
                <dd>
                    <h2>{{ request.user.nick_name }}</h2>
                    <p>{{ request.user.username }}</p>
                </dd>
            </dl>
            <div class="userbtns">
                <a class="personcenter fl" href="{% url 'users:user_info' %}">进入个人中心</a>
                <a class="fr" href="{% url 'logout' %}">退出</a>
            </div>
        </div>
    </div>
    <a href="{% url 'users:mymessage' %}">
        <div class="msg-num"><span id="MsgNum">{{ request.user.unread_message_nums }}</span></div>
    </a>
{% else %}
    <a class="fr registerbtn" href="{% url 'register' %}">注册</a>
    <a class="fr loginbtn" href="{% url 'login' %}">登录</a>
{% endif %}
